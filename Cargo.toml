[workspace]
resolver = "2"
members = [
    "isp-rectifier",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = "2"
env_logger = "0.10"
android_logger = "0.14"

# ── Profiles ────────────────────────────────────────────────────────────────
#
# Inherited from cam-rust/Cargo.toml (the cam-* ISP engine workspace) so that
# `cargo build` behaves consistently at the repo root and inside cam-rust/.
# Profiles declared in non-root manifests are ignored by cargo, so these live
# only at whichever manifest is the workspace root.
[profile.dev]
debug = 1
overflow-checks = false
opt-level = 2

[profile.test]
debug = 1
overflow-checks = false
opt-level = 2

[profile.release]
opt-level = 2
debug = 1
overflow-checks = false
codegen-units = 1
panic = "abort"
