[workspace]
resolver = "2"
members = [
    "isp-rectifier",
    "cam-rust/cam-types",
    "cam-rust/cam-isp",
    "cam-rust/cam-hal",
    "cam-rust/cam-hal-android",
    "cam-rust/cam-hal-linux",
    "cam-rust/cam-core",
    "cam-rust/cam-onnx",
    "cam-rust/cam-motion",
    "cam-rust/cam-binder",
    "cam-rust/cam-disp",
    "cam-rust/cam-ipa",
    "libcamera-ipa",
    "anw",
    "cli",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = "2"
env_logger = "0.10"
android_logger = "0.14"
# NativeActivity lifecycle + ANativeWindow (anw/softisp-anw, libsoftisp.so).
android-activity = { version = "0.6.1", features = ["native-activity"] }
# Raw ACamera* / AImageReader* NDK bindings (anw/softisp-anw).
ndk-sys = { version = "0.6", features = ["media"] }

# ── Profiles ────────────────────────────────────────────────────────────────
#
# These profiles apply to the whole workspace (cam-* ISP engine + isp-rectifier).
# Declaring them only at the workspace root is intentional: cargo ignores
# `[profile.*]` in non-root manifests, so every crate builds with the same
# precision regardless of which directory cargo is invoked from.
#
# The debug profile keeps `opt-level = 2` because the preview's hot path is
# pure Rust pixel loops (capture de-stride, u16→LE staging, f32→u8 narrowing,
# blit). At opt-level 0 they dominate the frame (~650 ms / 1.5 fps) and cause
# a stuttering or black preview. `debug = 1` keeps line-number tables without
# the full DWARF cost that bloats link time and RSS.
[profile.dev]
debug = 1
overflow-checks = false
opt-level = 2

[profile.test]
debug = 1
overflow-checks = false
opt-level = 2

# APK release profile — tuned for low-RAM devices (Termux/Android).
# debug = 1 keeps line-number tables without full DWARF, cutting peak RSS
# during codegen and linking by roughly half. overflow-checks off reduces
# generated code size. codegen-units = 1 lowers parallel memory pressure at
# the cost of slightly longer build time — acceptable on memory-constrained
# hosts where the APK is actually produced.
[profile.release]
opt-level = 2
debug = 1
overflow-checks = false
codegen-units = 1
panic = "abort"