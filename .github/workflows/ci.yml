name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Rust linting (fmt + clippy)
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'
      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: ./cam-rust
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== clippy lib: $crate ==="
            # Exclude 'mnn' feature (requires external libs not on CI)
            cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib --features "rectifier" -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          echo "=== clippy: cam-app ==="
          cargo clippy -p cam-app --jobs $CARGO_BUILD_JOBS -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed clippy"
            exit 1
          fi

  # Rust tests
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run library tests (no external deps)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-core cam-onnx cam-motion; do
            echo "=== test: $crate ==="
            cargo test -p "$crate" --jobs $CARGO_TEST_JOBS --lib --features "rectifier" --no-fail-fast 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test failed"
            exit 1
          fi

      - name: Run doc tests
        working-directory: ./cam-rust
        run: cargo test --jobs $CARGO_TEST_JOBS --workspace --doc --features "rectifier" --no-fail-fast

  # Rust clean rebuild test
  rust-clean-rebuild:
    name: Rust Clean Rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-clean-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clean build
        working-directory: ./cam-rust
        run: cargo clean

      - name: Build debug (without mnn feature - requires external libs)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== build lib debug: $crate ==="
            # Exclude 'mnn' feature (requires external MNN libs not on CI)
            cargo build -p "$crate" --jobs $CARGO_BUILD_JOBS --lib --features "rectifier" 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          echo "=== build app debug: cam-app (default features only, mnn requires external libs) ==="
          cargo build -p cam-app --jobs $CARGO_BUILD_JOBS 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed"
            exit 1
          fi

      - name: Build tests (without mnn feature)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-core cam-onnx cam-motion; do
            echo "=== build tests: $crate ==="
            cargo test -p "$crate" --jobs $CARGO_TEST_JOBS --no-run --features "rectifier" 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test build failed"
            exit 1
          fi

      - name: Build release (without mnn feature)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== build lib release: $crate ==="
            cargo build -p "$crate" --jobs $CARGO_BUILD_JOBS --release --lib --features "rectifier" 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          echo "=== build app release: cam-app (default features only, mnn requires external libs) ==="
          cargo build -p cam-app --jobs $CARGO_BUILD_JOBS --release 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed"
            exit 1
          fi

      - name: Verify binary sizes
        working-directory: ./cam-rust
        run: |
          echo "=== Debug binaries ==="
          find target/debug -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20
          echo ""
          echo "=== Release binaries ==="
          find target/release -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20

      - name: Verify binary sizes
        working-directory: ./cam-rust
        run: |
          echo "=== Debug binaries ==="
          find target/debug -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20
          echo ""
          echo "=== Release binaries ==="
          find target/release -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20

  # Python tests (DISABLED - no Python package in this repo)
  # python:

  # ONNX model validation (DISABLED - depends on Python package)
  # model-validation:

  # Documentation build (placeholder)
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Build docs (placeholder)
        run: echo "Documentation build placeholder"

  # Summary job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, rust-clean-rebuild, docs]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "All CI jobs completed"
          if [[ "${{ needs.rust-lint.result }}" != "success" ]]; then echo "❌ rust-lint failed"; exit 1; fi
          if [[ "${{ needs.rust-test.result }}" != "success" ]]; then echo "❌ rust-test failed"; exit 1; fi
          if [[ "${{ needs.rust-clean-rebuild.result }}" != "success" ]]; then echo "❌ rust-clean-rebuild failed"; exit 1; fi
          if [[ "${{ needs.docs.result }}" != "success" ]]; then echo "❌ docs failed"; exit 1; fi
          echo "✅ All jobs passed!"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
