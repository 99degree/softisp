name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Rust linting (fmt + clippy)
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'
      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: ./cam-rust
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== clippy lib: $crate ==="
            if [ "$crate" = "cam-isp" ]; then
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib --features "rectifier" -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            else
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            fi
            echo ""
          done
          echo "=== clippy: cam-app ==="
          cargo clippy -p cam-app --jobs $CARGO_BUILD_JOBS --all-features -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed clippy"
            exit 1
          fi

  # Build MNN libraries for testing
  build-mnn:
    name: Build MNN Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      mnn-lib-path: ${{ steps.set-output.outputs.mnn-lib-path }}
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            cmake ninja-build \
            libvulkan-dev vulkan-tools \
            libprotobuf-dev protobuf-compiler \
            libflatbuffers-dev \
            libopencv-dev \
            python3-pip \
            wget unzip
          pip3 install --quiet flatbuffers

      - name: Build MNN from source
        run: |
          # Build MNN from source (takes ~10-15 min)
          cd /tmp
          git clone --depth 1 --branch 3.6.0 https://github.com/alibaba/MNN.git
          cd MNN
          
          # Build with Vulkan support in build_vk directory (matches build.rs expectations)
          mkdir build_vk && cd build_vk
          cmake .. -G Ninja \
            -DMNN_BUILD_CONVERTER=ON \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_QUANTOOLS=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DMNN_VULKAN=ON \
            -DMNN_OPENCL=OFF \
            -DMNN_OPENGL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          ninja -j4
          # Explicitly build and install MNNConvert
          ninja -j4 MNNConvert
          sudo ninja install
          # Find and copy MNNConvert if not installed
          find /tmp/MNN/build_vk -name "MNNConvert" -type f -exec sudo cp {} /usr/local/bin/ \;
          # Also check tools/converter directory
          find /tmp/MNN/build_vk/tools/converter -name "MNNConvert" -type f -exec sudo cp {} /usr/local/bin/ \;
          ls -la /usr/local/bin/MNNConvert || echo "MNNConvert not found, searching..."
          find /tmp/MNN -name "MNNConvert" -type f 2>/dev/null
          ls -la /usr/local/lib/libMNN*.so
          ls -la /usr/local/bin/MNNConvert
          ls -la /usr/local/bin/MNNConvert
          ls -la /usr/local/bin/MNNConvert
        env:
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib

      - name: Set MNN library path output
        id: set-output
        run: echo "mnn-lib-path=/usr/local/lib" >> $GITHUB_OUTPUT

      - name: Cache MNN libraries
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/libMNN*.so
          key: ${{ runner.os }}-mnn-libs-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-mnn-libs-

  # Rust linting (fmt + clippy) - depends on MNN for cam-isp --all-features
  rust-lint-full:
    name: Rust Lint (fmt + clippy, with MNN)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-mnn
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'
      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Set MNN environment variables
        run: |
          echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L /usr/local/lib" >> $GITHUB_ENV
          echo "MNN_DIR=/tmp/MNN" >> $GITHUB_ENV
          echo "MNN_LIB_DIR=/usr/local/lib" >> $GITHUB_ENV
          echo "MNN_CONVERT_DIR=/usr/local/lib" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-lint-full-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        working-directory: ./cam-rust
        run: cargo fmt --all -- --check

      - name: Run clippy (with MNN feature)
        working-directory: ./cam-rust
        env:
          LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
          RUSTFLAGS: -L /usr/local/lib
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== clippy lib: $crate ==="
            if [ "$crate" = "cam-isp" ]; then
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib --features "rectifier mnn" -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            else
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            fi
            echo ""
          done
          echo "=== clippy: cam-app ==="
          cargo clippy -p cam-app --jobs $CARGO_BUILD_JOBS --all-features -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed clippy"
            exit 1
          fi

  # Rust tests (without MNN by default)
  rust-test:
    name: Rust Tests (no MNN)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run library tests (no external deps)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-core cam-onnx cam-motion; do
            echo "=== test: $crate ==="
            cargo test -p "$crate" --jobs $CARGO_TEST_JOBS --lib --no-fail-fast 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test failed"
            exit 1
          fi

      - name: Run cam-isp tests with rectifier feature
        working-directory: ./cam-rust
        run: cargo test -p cam-isp --jobs $CARGO_TEST_JOBS --lib --features "rectifier" --no-fail-fast

      - name: Run doc tests
        working-directory: ./cam-rust
        run: cargo test --jobs $CARGO_TEST_JOBS --workspace --doc --all-features --no-fail-fast

  # Rust tests with MNN (full integration)
  rust-test-mnn:
    name: Rust Tests (with MNN)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-mnn
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Set MNN environment variables
        run: |
          echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L /usr/local/lib" >> $GITHUB_ENV
          echo "MNN_DIR=/tmp/MNN" >> $GITHUB_ENV
          echo "MNN_LIB_DIR=/usr/local/lib" >> $GITHUB_ENV
          echo "MNN_CONVERT_DIR=/usr/local/lib" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-test-mnn-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run library tests (no external deps)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-core cam-onnx cam-motion; do
            echo "=== test: $crate ==="
            cargo test -p "$crate" --jobs $CARGO_TEST_JOBS --lib --no-fail-fast 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test failed"
            exit 1
          fi

      - name: Run cam-isp tests with MNN feature
        working-directory: ./cam-rust
        env:
          LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
          RUSTFLAGS: -L /usr/local/lib
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib
        run: cargo test -p cam-isp --jobs $CARGO_TEST_JOBS --lib --features "rectifier mnn" --no-fail-fast

      - name: Run MNN integration tests
        working-directory: ./cam-rust
        env:
          LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
          RUSTFLAGS: -L /usr/local/lib
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib
        run: |
          # Run MNN-specific tests (require MNN libs)
          cargo test -p cam-isp --jobs $CARGO_TEST_JOBS --test test_mnn_engine --features "mnn" -- --ignored --nocapture 2>&1 || true

      - name: Run doc tests
        working-directory: ./cam-rust
        run: cargo test --jobs $CARGO_TEST_JOBS --workspace --doc --all-features --no-fail-fast

  # Rust clean rebuild test
  rust-clean-rebuild:
