name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Rust linting (fmt + clippy)
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'
      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: ./cam-rust
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== clippy lib: $crate ==="
            if [ "$crate" = "cam-isp" ]; then
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib --features "rectifier" -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            else
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            fi
            echo ""
          done
          echo "=== clippy: cam-app ==="
          cargo clippy -p cam-app --jobs $CARGO_BUILD_JOBS --all-features -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed clippy"
            exit 1
          fi

  # Rust linting (fmt + clippy) - with MNN feature
  # Builds MNN from source (cached across runs)
  rust-lint-full:
    name: Rust Lint (fmt + clippy, with MNN)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'
      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libv4l-dev \
            cmake ninja-build \
            libvulkan-dev \
            libprotobuf-dev protobuf-compiler

      - name: Cache MNN build
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/libMNN*.so
          key: ${{ runner.os }}-mnn-libs-v2-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-mnn-libs-

      - name: Build MNN from source
        run: |
          # Skip if already cached
          if ls /usr/local/lib/libMNN*.so 1>/dev/null 2>&1; then
            echo "MNN libraries found in cache, skipping build"
            ls -la /usr/local/lib/libMNN*.so
            sudo ldconfig
            exit 0
          fi
          cd /tmp
          git clone --depth 1 --branch 3.6.0 https://github.com/alibaba/MNN.git
          cd MNN
          mkdir build_vk && cd build_vk
          cmake .. -G Ninja \
            -DMNN_BUILD_CONVERTER=ON \
            -DMNN_VULKAN=ON \
            -DMNN_OPENCL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          ninja -j$(nproc)
          sudo ninja install
          # Copy libs cmake doesn't install
          find /tmp/MNN/build_vk -name "libMNN_Vulkan.so" -exec sudo cp {} /usr/local/lib/ \;
          find /tmp/MNN/build_vk -name "libMNNConvertDeps.so" -exec sudo cp {} /usr/local/lib/ \;
          sudo ldconfig
          echo "=== Installed MNN libraries ==="
          ls -la /usr/local/lib/libMNN*.so

      - name: Set MNN environment
        run: |
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L /usr/local/lib" >> $GITHUB_ENV
          echo "MNN_DIR=/tmp/MNN" >> $GITHUB_ENV
          echo "MNN_LIB_DIR=/usr/local/lib" >> $GITHUB_ENV
          echo "MNN_CONVERT_DIR=/usr/local/lib" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-lint-full-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        working-directory: ./cam-rust
        run: cargo fmt --all -- --check

      - name: Run clippy (with MNN feature)
        working-directory: ./cam-rust
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          RUSTFLAGS: -L /usr/local/lib
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== clippy lib: $crate ==="
            if [ "$crate" = "cam-isp" ]; then
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib --features "rectifier mnn" -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            else
              cargo clippy -p "$crate" --jobs $CARGO_BUILD_JOBS --lib -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            fi
            echo ""
          done
          echo "=== clippy: cam-app ==="
          cargo clippy -p cam-app --jobs $CARGO_BUILD_JOBS --all-features -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed clippy"
            exit 1
          fi

  # Rust tests (without MNN by default)
