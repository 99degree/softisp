name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Rust tests and build
  rust:
    name: Rust Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build release
        run: cargo build --workspace --release --all-targets

  # Python tests
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -q pytest pytest-cov onnxruntime numpy
          pip install -q -e ./isp-rectifier

      - name: Run Python tests
        working-directory: ./isp-rectifier
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Model validation (quick)
        working-directory: ./isp-rectifier
        run: |
          python3 << 'PYEOF'
          import onnxruntime as ort
          import numpy as np

          # Quick model load test
          sess = ort.InferenceSession('models/fusedispcontroller_int8.onnx')
          print(f'Model loaded: {sess.get_inputs()[0].name} -> {sess.get_outputs()[0].name}')

          # Quick inference test
          hist = np.random.randn(1, 256).astype(np.float32)
          meta = np.random.randn(1, 52).astype(np.float32)
          out = ort.InferenceSession('models/fusedispcontroller_int8.onnx').run(None, {
              'histogram': hist, 'metadata': meta
          })
          print(f'Outputs: {[o.shape for o in out]}')
        working-directory: ./isp-rectifier

  # ONNX model validation
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4

      - name: Install onnxruntime
        run: pip install -q onnxruntime numpy

      - name: Validate ONNX models
        run: |
          python3 << 'PYEOF'
          import onnx
          import onnxruntime as ort
          import numpy as np

          models = [
              'fusedispcontroller.onnx',
              'fusedispcontroller_int8.onnx',
              'fusedispcontroller_fp16.onnx',
              'fusedispcontroller_light.onnx',
              'fusedispcontroller_light_int8.onnx',
              'fusedispcontroller_medium.onnx',
              'fusedispcontroller_medium_int8.onnx',
          ]

          for model_name in ['fusedispcontroller_int8.onnx']:
              path = f'isp-rectifier/models/{model_name}'
              print(f'\n🔍 Validating {model_name}...')

              # Load and check
              model = onnx.load(f'isp-rectifier/models/{model_name}')
              onnx.checker.check_model(model)
              print(f'  ✅ ONNX checker passed')

              # Quick inference test
              sess = ort.InferenceSession(f'isp-rectifier/models/{model_name}', providers=['CPUExecutionProvider'])
              input_names = [i.name for i in ort.InferenceSession(f'isp-rectifier/models/{model_name}').get_inputs()]
              output_names = [o.name for o in ort.InferenceSession(f'isp-rectifier/models/{model_name}').get_outputs()]

              # Quick inference
              hist = np.random.randn(1, 256).astype(np.float32)
              meta = np.random.randn(1, 52).astype(np.float32)
              sess = ort.InferenceSession(f'isp-rectifier/models/{model_name}', providers=['CPUExecutionProvider'])
              outputs = sess.run(None, {'histogram': np.random.randn(1, 256).astype(np.float32), 'metadata': np.random.randn(1, 52).astype(np.float32)})

              print(f'  ✅ Inputs: {input_names}')
              print(f'  ✅ Outputs: {output_names}')
              print(f'  ✅ Output shapes: {[o.shape for o in outputs]}')
              print(f'  ✅ Model {model_name} validation passed!')

  # Documentation build (placeholder)
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs (placeholder)
        run: echo "Documentation build placeholder"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
EOF