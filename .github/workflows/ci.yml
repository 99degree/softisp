            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run library tests (no external deps)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-core cam-onnx cam-motion; do
            echo "=== test: $crate ==="
            cargo test -p "$crate" --jobs $CARGO_TEST_JOBS --lib --no-fail-fast 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test failed"
            exit 1
          fi

      - name: Run cam-isp tests with rectifier feature
        working-directory: ./cam-rust
        run: cargo test -p cam-isp --jobs $CARGO_TEST_JOBS --lib --features "rectifier" --no-fail-fast

      - name: Run doc tests
        working-directory: ./cam-rust
        run: cargo test --jobs $CARGO_TEST_JOBS --workspace --doc --all-features --no-fail-fast

  # Rust tests with MNN (full integration)
  # Builds MNN from source (cached across runs)
  rust-test-mnn:
