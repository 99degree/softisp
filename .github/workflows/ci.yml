name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Rust linting (fmt + clippy)
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory "*"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev libv4l2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: ./cam-rust
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== clippy lib: $crate ==="
            cargo clippy -p "$crate" --lib --all-features -- -D warnings 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          echo "=== clippy: cam-app ==="
          cargo clippy -p cam-app --all-features -- -d warnings 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed clippy"
            exit 1
          fi

  # Rust tests
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev libv4l2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run library tests (no external deps)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-core cam-onnx cam-motion; do
            echo "=== test: $crate ==="
            cargo test -p "$crate" --lib --all-features --no-fail-fast 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test failed"
            exit 1
          fi

      - name: Run doc tests
        working-directory: ./cam-rust
        run: cargo test --workspace --doc --all-features --no-fail-fast

  # Rust clean rebuild test
  rust-clean-rebuild:
    name: Rust Clean Rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libv4l-dev libv4l2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-clean-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clean build
        working-directory: ./cam-rust
        run: cargo clean

      - name: Build debug (all features)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== build lib debug: $crate ==="
            cargo build -p "$crate" --lib --all-features 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          echo "=== build app debug: cam-app ==="
          cargo build -p cam-app --all-features 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed"
            exit 1
          fi

      - name: Build tests (all features)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-core cam-onnx cam-motion; do
            echo "=== build tests: $crate ==="
            cargo test -p "$crate" --no-run --all-features 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test build failed"
            exit 1
          fi

      - name: Build release (all features)
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== build lib release: $crate ==="
            cargo build -p "$crate" --release --lib --all-features 2>&1 || ERRORS=$((ERRORS+1))
            echo ""
          done
          echo "=== build app release: cam-app ==="
          cargo build -p cam-app --release --all-features 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed"
            exit 1
          fi

      - name: Verify binary sizes
        working-directory: ./cam-rust
        run: |
          echo "=== Debug binaries ==="
          find target/debug -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20
          echo ""
          echo "=== Release binaries ==="
          find target/release -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20

      - name: Verify binary sizes
        working-directory: ./cam-rust
        run: |
          echo "=== Debug binaries ==="
          find target/debug -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20
          echo ""
          echo "=== Release binaries ==="
          find target/release -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20

  # Python tests
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./isp-rectifier
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -q pytest pytest-cov onnxruntime numpy
          pip install -q -r requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Model validation (quick)
        run: python3 scripts/validate_model_ci.py

  # ONNX model validation
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rust-test, python]
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Install onnxruntime
        run: pip install -q onnxruntime numpy

      - name: Validate ONNX models
        run: python3 isp-rectifier/scripts/validate_models_ci.py

      - name: Validate model I/O shapes
        run: python3 isp-rectifier/scripts/validate_model_io.py

  # Documentation build (placeholder)
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Build docs (placeholder)
        run: echo "Documentation build placeholder"

  # Summary job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, rust-clean-rebuild, python, model-validation, docs]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "All CI jobs completed"
          if [[ "${{ needs.rust-lint.result }}" != "success" ]]; then echo "❌ rust-lint failed"; exit 1; fi
          if [[ "${{ needs.rust-test.result }}" != "success" ]]; then echo "❌ rust-test failed"; exit 1; fi
          if [[ "${{ needs.rust-clean-rebuild.result }}" != "success" ]]; then echo "❌ rust-clean-rebuild failed"; exit 1; fi
          if [[ "${{ needs.python.result }}" != "success" ]]; then echo "❌ python failed"; exit 1; fi
          if [[ "${{ needs.model-validation.result }}" != "success" ]]; then echo "❌ model-validation failed"; exit 1; fi
          if [[ "${{ needs.docs.result }}" != "success" ]]; then echo "❌ docs failed"; exit 1; fi
          echo "✅ All jobs passed!"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true