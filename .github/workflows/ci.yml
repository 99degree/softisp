            echo ""
          done
          echo "=== build tests: cam-isp (with MNN feature) ==="
          cargo test -p cam-isp --jobs $CARGO_TEST_JOBS --no-run --lib --tests --features "mnn" 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) test build failed"
            exit 1
          fi

      - name: Build release (with MNN feature)
        working-directory: ./cam-rust
        env:
          LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
          RUSTFLAGS: -L /usr/local/lib
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder; do
            echo "=== build lib release: $crate ==="
            if [ "$crate" = "cam-isp" ]; then
              cargo build -p "$crate" --jobs $CARGO_BUILD_JOBS --release --lib --features "rectifier mnn" 2>&1 || ERRORS=$((ERRORS+1))
            else
              cargo build -p "$crate" --jobs $CARGO_BUILD_JOBS --release --lib 2>&1 || ERRORS=$((ERRORS+1))
