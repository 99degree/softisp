name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Rust tests and build
  rust:
    name: Rust Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build release
        run: cargo build --workspace --release --all-targets

  # Python tests
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    working-directory: ./isp-rectifier
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -q pytest pytest-cov onnxruntime numpy
          pip install -q -e ./isp-rectifier

      - name: Run Python tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Model validation (quick)
        run: python3 scripts/validate_model_ci.py

  # ONNX model validation
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4

      - name: Install onnxruntime
        run: pip install -q onnxruntime numpy

      - name: Validate ONNX models
        run: python3 scripts/validate_models_ci.py

  # Documentation build (placeholder)
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs (placeholder)
        run: echo "Documentation build placeholder"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true