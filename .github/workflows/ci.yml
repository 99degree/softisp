name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Rust linting (fmt + clippy)
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: ./cam-rust
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./cam-rust
        run: |
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder cam-app; do
            echo "=== clippy: $crate ==="
            cargo clippy -p "$crate" --all-targets --all-features -- -D warnings || ERRORS=$((ERRORS+1))
            echo ""
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed clippy"
            exit 1
          fi

  # Rust tests
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cam-rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests (all targets, all features)
        working-directory: ./cam-rust
        run: cargo test --workspace --all-targets --all-features --no-fail-fast

      - name: Run doc tests
        working-directory: ./cam-rust
        run: cargo test --workspace --doc --all-features --no-fail-fast

  # Rust clean rebuild test
  rust-clean-rebuild:
    name: Rust Clean Rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-clean-${{ hashFiles('cam-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clean build
        working-directory: ./cam-rust
        run: cargo clean

      - name: Build debug (all targets, all features)
        working-directory: ./cam-rust
        run: |
          LOGFILE="${RUNNER_TEMP}/build-debug.log"
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder cam-app; do
            echo "=== build debug: $crate ===" | tee -a "$LOGFILE"
            cargo build -p "$crate" --all-targets --all-features 2>&1 | tee -a "$LOGFILE"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then ERRORS=$((ERRORS+1)); fi
            echo "" | tee -a "$LOGFILE"
          done
          echo "=== Build complete: $ERRORS errors ===" | tee -a "$LOGFILE"
          if [ "$ERRORS" -ne 0 ]; then exit 1; fi

      - name: Upload debug build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: ${{ runner.temp }}/build-debug.log
          retention-days: 7
          if-no-files-found: warn

      - name: Build release (all targets, all features)
        working-directory: ./cam-rust
        run: |
          LOGFILE="${RUNNER_TEMP}/build-release.log"
          ERRORS=0
          for crate in cam-types cam-hal cam-hal-android cam-hal-linux cam-isp cam-core cam-onnx cam-motion cam-binder cam-app; do
            echo "=== build release: $crate ===" | tee -a "$LOGFILE"
            cargo build -p "$crate" --release --all-targets --all-features 2>&1 | tee -a "$LOGFILE"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then ERRORS=$((ERRORS+1)); fi
            echo "" | tee -a "$LOGFILE"
          done
          echo "=== Build complete: $ERRORS errors ===" | tee -a "$LOGFILE"
          if [ "$ERRORS" -ne 0 ]; then exit 1; fi

      - name: Upload release build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-logs
          path: ${{ runner.temp }}/build-release.log
          retention-days: 7
          if-no-files-found: warn

      - name: Verify binary sizes
        working-directory: ./cam-rust
        run: |
          echo "=== Debug binaries ==="
          find target/debug -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20
          echo ""
          echo "=== Release binaries ==="
          find target/release -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20

  # Python tests
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./isp-rectifier
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -q pytest pytest-cov onnxruntime numpy
          pip install -q -r requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Model validation (quick)
        run: python3 scripts/validate_model_ci.py

  # ONNX model validation
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rust-test, python]
    steps:
      - uses: actions/checkout@v4

      - name: Install onnxruntime
        run: pip install -q onnxruntime numpy

      - name: Validate ONNX models
        run: python3 isp-rectifier/scripts/validate_models_ci.py

      - name: Validate model I/O shapes
        run: python3 isp-rectifier/scripts/validate_model_io.py

  # Documentation build (placeholder)
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs (placeholder)
        run: echo "Documentation build placeholder"

  # Summary job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, rust-clean-rebuild, python, model-validation, docs]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "All CI jobs completed"
          if [[ "${{ needs.rust-lint.result }}" != "success" ]]; then echo "❌ rust-lint failed"; exit 1; fi
          if [[ "${{ needs.rust-test.result }}" != "success" ]]; then echo "❌ rust-test failed"; exit 1; fi
          if [[ "${{ needs.rust-clean-rebuild.result }}" != "success" ]]; then echo "❌ rust-clean-rebuild failed"; exit 1; fi
          if [[ "${{ needs.python.result }}" != "success" ]]; then echo "❌ python failed"; exit 1; fi
          if [[ "${{ needs.model-validation.result }}" != "success" ]]; then echo "❌ model-validation failed"; exit 1; fi
          if [[ "${{ needs.docs.result }}" != "success" ]]; then echo "❌ docs failed"; exit 1; fi
          echo "✅ All jobs passed!"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true