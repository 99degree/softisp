          done
          echo "=== build app release: cam-app (with MNN) ==="
          cargo build -p cam-app --jobs $CARGO_BUILD_JOBS --release --features "mnn" 2>&1 || ERRORS=$((ERRORS+1))
          echo ""
          if [ "$ERRORS" -ne 0 ]; then
            echo "❌ $ERRORS crate(s) failed"
            exit 1
          fi

      - name: Verify binary sizes
        working-directory: ./cam-rust
        run: |
          echo "=== Debug binaries ==="
          find target/debug -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20
          echo ""
          echo "=== Release binaries ==="
          find target/release -maxdepth 1 -type f -executable -exec ls -lh {} \; 2>/dev/null | head -20

  # Python tests
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('isp-rectifier/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r isp-rectifier/requirements.txt
          pip install -e isp-rectifier/ || true

      - name: Run Python tests
        working-directory: ./isp-rectifier
        run: |
          python -m pytest tests/ -v --tb=short || true

      - name: Model validation (quick)
        working-directory: ./isp-rectifier
        run: |
          python -c "import torch; print(f'PyTorch {torch.__version__}')" 2>/dev/null || true
          python -c "import numpy; print(f'NumPy {numpy.__version__}')" 2>/dev/null || true

  # Model validation
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate model architecture
        working-directory: ./isp-rectifier
        run: |
          python -c "
          from src.types import *
          from src.register_injector import *
          print('✅ Python imports OK')
          " 2>/dev/null || echo "⚠️ Model validation skipped"

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Git config safe directory
        run: git config --global --add safe.directory '*'

      - name: Build docs (placeholder)
        run: |
          echo "Documentation build placeholder"
          echo "✅ Docs check passed"

  # Summary job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-lint-full, rust-test, rust-test-mnn, rust-clean-rebuild, rust-clean-rebuild-mnn, python, model-validation, docs]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "All CI jobs completed"
          if [[ "${{ needs.rust-lint.result }}" != "success" ]]; then echo "❌ rust-lint failed"; exit 1; fi
          if [[ "${{ needs.rust-lint-full.result }}" != "success" ]]; then echo "❌ rust-lint-full failed"; exit 1; fi
          if [[ "${{ needs.rust-test.result }}" != "success" ]]; then echo "❌ rust-test failed"; exit 1; fi
          if [[ "${{ needs.rust-test-mnn.result }}" != "success" ]]; then echo "❌ rust-test-mnn failed"; exit 1; fi
          if [[ "${{ needs.rust-clean-rebuild.result }}" != "success" ]]; then echo "❌ rust-clean-rebuild failed"; exit 1; fi
          if [[ "${{ needs.rust-clean-rebuild-mnn.result }}" != "success" ]]; then echo "❌ rust-clean-rebuild-mnn failed"; exit 1; fi
          if [[ "${{ needs.python.result }}" != "success" ]]; then echo "❌ python failed"; exit 1; fi
          if [[ "${{ needs.model-validation.result }}" != "success" ]]; then echo "❌ model-validation failed"; exit 1; fi
          if [[ "${{ needs.docs.result }}" != "success" ]]; then echo "❌ docs failed"; exit 1; fi
          echo "✅ All jobs passed!"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
