      - name: Set cargo job count
        run: |
          echo "CARGO_BUILD_JOBS=4" >> $GITHUB_ENV
          echo "CARGO_TEST_JOBS=4" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
