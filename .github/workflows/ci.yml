      - name: Run cam-isp tests with MNN feature
        working-directory: ./cam-rust
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          RUSTFLAGS: -L /usr/local/lib
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib
        run: cargo test -p cam-isp --jobs $CARGO_TEST_JOBS --lib --features "rectifier mnn" --no-fail-fast

      - name: Run MNN integration tests
        working-directory: ./cam-rust
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          RUSTFLAGS: -L /usr/local/lib
          MNN_DIR: /tmp/MNN
          MNN_LIB_DIR: /usr/local/lib
          MNN_CONVERT_DIR: /usr/local/lib
        run: |
          # Run MNN-specific tests (require MNN libs)
          cargo test -p cam-isp --jobs $CARGO_TEST_JOBS --test test_mnn_engine --features "mnn" -- --ignored --nocapture 2>&1 || true

      - name: Run doc tests
        working-directory: ./cam-rust
        run: cargo test --jobs $CARGO_TEST_JOBS --workspace --doc --all-features --no-fail-fast

