name: Train ISP Student Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '100'
      batch_size:
        description: 'Batch size'
        required: false
        default: '32'
      learning_rate:
        description: 'Learning rate'
        required: false
        default: '0.001'
      use_gpu:
        description: 'Use GPU runner (self-hosted)'
        required: false
        default: 'false'
      synthetic_samples:
        description: 'Number of synthetic samples (if no real data)'
        required: false
        default: '10000'
      teacher_ccmnet:
        description: 'Path to CCMNet weights'
        required: false
        default: 'models/ccmnet.pth'
      teacher_awb:
        description: 'Path to Time-Aware AWB weights'
        required: false
        default: 'models/time_aware_awb.pth'
      teacher_isp:
        description: 'Path to Neural ISP Tuning weights'
        required: false
        default: 'models/neural_isp_tuning.pth'

  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 2 AM

  push:
    paths:
      - 'isp-rectifier/distill_model.py'
      - 'isp-rectifier/collect_teacher_dataset_production.py'
      - 'isp-rectifier/requirements.txt'
      - 'isp-rectifier/models/**'

jobs:
  prepare-data:
    name: Prepare Teacher Dataset
    runs-on: ${{ github.event.inputs.use_gpu == 'true' && 'self-hosted-gpu' || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      dataset_path: ${{ steps.dataset.outputs.path }}
      num_samples: ${{ steps.dataset.outputs.num_samples }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: isp-rectifier/requirements.txt

      - name: Install dependencies
        working-directory: ./isp-rectifier
        run: |
          pip install -r requirements.txt
          pip install gdown  # For downloading from Google Drive if needed

      - name: Download teacher weights (if URLs provided)
        if: env.TEACHER_WEIGHTS_URL != ''
        working-directory: ./isp-rectifier
        run: |
          mkdir -p models
          echo "Downloading teacher weights from $TEACHER_WEIGHTS_URL"
          gdown --folder "$TEACHER_WEIGHTS_URL" -O models/

      - name: Generate/Collect teacher dataset
        id: dataset
        working-directory: ./isp-rectifier
        env:
          TEACHER_CCMNET: ${{ github.event.inputs.teacher_ccmnet || '' }}
          TEACHER_AWB: ${{ github.event.inputs.teacher_awb || '' }}
          TEACHER_ISP: ${{ github.event.inputs.teacher_isp || '' }}
          SYNTHETIC_SAMPLES: ${{ github.event.inputs.synthetic_samples || '5000' }}
        run: |
          if [ -n "$TEACHER_CCMNET" ] && [ -f "$TEACHER_CCMNET" ] && \
             [ -n "$TEACHER_AWB" ] && [ -f "$TEACHER_AWB" ] && \
             [ -n "$TEACHER_ISP" ] && [ -f "$TEACHER_ISP" ]; then
            echo "Using real teacher models"
            python collect_teacher_dataset_production.py \
              --input-dir ./data/dng_frames \
              --metadata-dir ./data/metadata \
              --output-dir teacher_dataset \
              --ccmnet-weights "$TEACHER_CCMNET" \
              --awb-weights "$TEACHER_AWB" \
              --isp-tuning-weights "$TEACHER_ISP" \
              --batch-size 64
          else
            echo "Generating synthetic dataset ($SYNTHETIC_SAMPLES samples)"
            python collect_teacher_dataset_production.py \
              --synthetic $SYNTHETIC_SAMPLES \
              --output-dir teacher_dataset
          fi
          
          # Output dataset info
          python -c "
          import json
          with open('teacher_dataset/dataset_info.json') as f:
              info = json.load(f)
          print(f'path=teacher_dataset')
          print(f'num_samples={info[\"num_samples\"]}')
          " >> $GITHUB_OUTPUT

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-dataset
          path: isp-rectifier/teacher_dataset/
          retention-days: 7

  train:
    name: Train Student Model
    runs-on: ${{ github.event.inputs.use_gpu == 'true' && 'self-hosted-gpu' || 'ubuntu-latest' }}
    needs: prepare-data
    timeout-minutes: 180
    outputs:
      best_model_path: ${{ steps.train.outputs.model_path }}
      best_val_loss: ${{ steps.train.outputs.val_loss }}
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: teacher-dataset
          path: ./isp-rectifier/teacher_dataset

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: isp-rectifier/requirements.txt

      - name: Install dependencies
        working-directory: ./isp-rectifier
        run: pip install -r requirements.txt

      - name: Verify dataset
        working-directory: ./isp-rectifier
        run: |
          python -c "
          import numpy as np
          data = np.load('teacher_dataset/teacher_dataset.npz', allow_pickle=True)
          print(f'Keys: {list(data.keys())}')
          for k, v in data.items():
              if hasattr(v, 'shape'):
                  print(f'  {k}: {v.shape} {v.dtype}')
          "

      - name: Train model
        id: train
        working-directory: ./isp-rectifier
        env:
          EPOCHS: ${{ github.event.inputs.epochs || '50' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '32' }}
          LR: ${{ github.event.inputs.learning_rate || '0.001' }}
          USE_GPU: ${{ github.event.inputs.use_gpu || 'false' }}
        run: |
          python distill_model.py \
            --train \
            --dataset teacher_dataset/teacher_dataset.npz \
            --epochs $EPOCHS \
            --batch-size $BATCH_SIZE \
            --lr $LR \
            --checkpoint-dir checkpoints \
            --device $([ "$USE_GPU" = "true" ] && echo "cuda" || echo "cpu")

          # Extract best model info
          python -c "
          import torch
          ckpt = torch.load('checkpoints/best_model.pth', map_location='cpu')
          print(f'model_path=checkpoints/best_model.pth')
          print(f'val_loss={ckpt[\"val_loss\"]:.6f}')
          print(f'epoch={ckpt[\"epoch\"]}')
          " >> $GITHUB_OUTPUT

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-output
          path: |
            isp-rectifier/checkpoints/
            isp-rectifier/teacher_dataset/dataset_info.json
          retention-days: 30

  export-and-validate:
    name: Export ONNX & Validate
    runs-on: ubuntu-latest
    needs: train
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download training output
        uses: actions/download-artifact@v4
        with:
          name: training-output
          path: ./isp-rectifier

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./isp-rectifier
        run: pip install -r requirements.txt

      - name: Create test model (if no checkpoint)
        working-directory: ./isp-rectifier
        run: |
          if [ ! -f checkpoints/best_model.pth ]; then
            echo "No checkpoint found, creating mock ONNX model"
            python gen_mock.py -o fusedispcontroller.onnx --all --benchmark
          else
            echo "Checkpoint found, will export real model"
          fi

      - name: Export ONNX (FP32)
        id: export
        working-directory: ./isp-rectifier
        run: |
          if [ -f checkpoints/best_model.pth ]; then
            python distill_model.py \
              --export \
              --model checkpoints/best_model.pth \
              --output fusedispcontroller.onnx
          else
            echo "Using mock model from previous step"
          fi

      - name: Upload FP32 model (immediate)
        uses: actions/upload-artifact@v4
        with:
          name: model-fp32
          path: isp-rectifier/fusedispcontroller.onnx
          retention-days: 90

      - name: Quantize INT8
        id: quant_int8
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: python quantize_model.py int8 fusedispcontroller.onnx fusedispcontroller_int8.onnx

      - name: Upload INT8 model
        uses: actions/upload-artifact@v4
        with:
          name: model-int8
          path: isp-rectifier/fusedispcontroller_int8.onnx
          retention-days: 90

      - name: Quantize FP16
        id: quant_fp16
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: python quantize_model.py fp16 fusedispcontroller.onnx fusedispcontroller_fp16.onnx

      - name: Upload FP16 model
        uses: actions/upload-artifact@v4
        with:
          name: model-fp16
          path: isp-rectifier/fusedispcontroller_fp16.onnx
          retention-days: 90

      # === Lightweight model (~118K params, ~10x smaller) ===
      - name: Export light model (FP32)
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: |
          python gen_mock.py --light -o fusedispcontroller_light.onnx --benchmark

      - name: Upload light FP32 model
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: model-light-fp32
          path: isp-rectifier/fusedispcontroller_light.onnx
          retention-days: 90

      - name: Quantize light INT8
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: python quantize_model.py int8 fusedispcontroller_light.onnx fusedispcontroller_light_int8.onnx

      - name: Upload light INT8 model
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: model-light-int8
          path: isp-rectifier/fusedispcontroller_light_int8.onnx
          retention-days: 90

      - name: Quantize light FP16
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: python quantize_model.py fp16 fusedispcontroller_light.onnx fusedispcontroller_light_fp16.onnx

      - name: Upload light FP16 model
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: model-light-fp16
          path: isp-rectifier/fusedispcontroller_light_fp16.onnx
          retention-days: 90
      # === End lightweight model ===

      # === Medium-weight model (~350K params, ~3x smaller than full) ===
      - name: Export medium model (FP32)
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: |
          python gen_mock.py --medium -o fusedispcontroller_medium.onnx --benchmark

      - name: Upload medium FP32 model
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: model-medium-fp32
          path: isp-rectifier/fusedispcontroller_medium.onnx
          retention-days: 90

      - name: Quantize medium INT8
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: python quantize_model.py int8 fusedispcontroller_medium.onnx fusedispcontroller_medium_int8.onnx

      - name: Upload medium INT8 model
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: model-medium-int8
          path: isp-rectifier/fusedispcontroller_medium_int8.onnx
          retention-days: 90

      - name: Quantize medium FP16
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: python quantize_model.py fp16 fusedispcontroller_medium.onnx fusedispcontroller_medium_fp16.onnx

      - name: Upload medium FP16 model
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: model-medium-fp16
          path: isp-rectifier/fusedispcontroller_medium_fp16.onnx
          retention-days: 90
      # === End medium-weight model ===

      - name: Validate INT8 quantization
        id: validate_int8
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: |
          python batch_validate_quantization.py \
            --fp32-model fusedispcontroller.onnx \
            --quant-model fusedispcontroller_int8.onnx \
            --samples 1000 \
            --output-dir validation_int8

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            isp-rectifier/validation_int8/
            isp-rectifier/validation_fp16/
          retention-days: 30
          if-no-files-found: ignore

      - name: Check thresholds
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: python check_thresholds.py --strict

      - name: Generate model card
        id: model_card
        working-directory: ./isp-rectifier
        continue-on-error: true
        run: |
          if [ -f checkpoints/best_model.pth ] && [ -f teacher_dataset/dataset_info.json ]; then
            python scripts/generate_model_card.py \
              --model fusedispcontroller.onnx \
              --int8 fusedispcontroller_int8.onnx \
              --fp16 fusedispcontroller_fp16.onnx \
              --checkpoint checkpoints/best_model.pth \
              --dataset teacher_dataset/dataset_info.json \
              --output MODEL_CARD.md
          else
            echo 'Creating minimal model card'
            echo '# Fused ISP Controller Model Card' > MODEL_CARD.md
            echo '' >> MODEL_CARD.md
            echo '**Note**: Generated from mock model. No real training checkpoint available.' >> MODEL_CARD.md
          fi

      - name: Upload model artifacts (individual)
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            isp-rectifier/fusedispcontroller.onnx
            isp-rectifier/fusedispcontroller_int8.onnx
            isp-rectifier/fusedispcontroller_fp16.onnx
            isp-rectifier/fusedispcontroller_light.onnx
            isp-rectifier/fusedispcontroller_light_int8.onnx
            isp-rectifier/fusedispcontroller_light_fp16.onnx
            isp-rectifier/fusedispcontroller_medium.onnx
            isp-rectifier/fusedispcontroller_medium_int8.onnx
            isp-rectifier/fusedispcontroller_medium_fp16.onnx
            isp-rectifier/checkpoints/best_model.pth
            isp-rectifier/checkpoints/history.json
            isp-rectifier/MODEL_CARD.md
          retention-days: 90

      - name: Create all-in-one zip
        continue-on-error: true
        run: |
          mkdir -p dist
          # Copy all ONNX models that exist (full, medium, light x FP32/INT8/FP16)
          shopt -s nullglob
          cp isp-rectifier/*.onnx dist/ 2>/dev/null || true
          # Copy training metadata and model card (if they exist)
          cp isp-rectifier/checkpoints/best_model.pth dist/ 2>/dev/null || true
          cp isp-rectifier/checkpoints/history.json dist/ 2>/dev/null || true
          cp isp-rectifier/MODEL_CARD.md dist/ 2>/dev/null || true
          # Create zip with all files
          cd dist && zip -r ../isp-rectifier-models.zip . && cd ..
          ls -lh isp-rectifier-models.zip

      - name: Upload all-in-one zip
        uses: actions/upload-artifact@v4
        with:
          name: isp-rectifier-models-zip
          path: isp-rectifier-models.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Create model release (on tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            isp-rectifier/fusedispcontroller.onnx
            isp-rectifier/fusedispcontroller_int8.onnx
            isp-rectifier/fusedispcontroller_fp16.onnx
            isp-rectifier/fusedispcontroller_light.onnx
            isp-rectifier/fusedispcontroller_light_int8.onnx
            isp-rectifier/fusedispcontroller_light_fp16.onnx
            isp-rectifier/fusedispcontroller_medium.onnx
            isp-rectifier/fusedispcontroller_medium_int8.onnx
            isp-rectifier/fusedispcontroller_medium_fp16.onnx
            isp-rectifier/MODEL_CARD.md
            isp-rectifier-models.zip
          generate_release_notes: true

  benchmark:
    name: Benchmark Inference
    runs-on: ubuntu-latest
    needs: export-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Download models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: ./models

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install onnxruntime onnx numpy tqdm

      - name: Copy models to flat directory
        run: |
          mkdir -p ./benchmark_models
          find ./models -name '*.onnx' -type f -exec cp -v {} ./benchmark_models/ \;
          ls -la ./benchmark_models/

      - name: Benchmark ONNX Runtime
        working-directory: ./benchmark_models
        run: |
          python -c "
          import onnxruntime as ort
          import numpy as np
          import time

          for model_name in ['fusedispcontroller.onnx', 'fusedispcontroller_int8.onnx', 'fusedispcontroller_fp16.onnx']:
              sess = ort.InferenceSession(model_name)
              is_fp16 = 'fp16' in model_name
              if is_fp16:
                  hist = np.random.randn(1, 256).astype(np.float16)
                  meta = np.random.randn(1, 11).astype(np.float16)
              else:
                  hist = np.random.randn(1, 256).astype(np.float32)
                  meta = np.random.randn(1, 11).astype(np.float32)
              
              # Warmup
              for _ in range(10):
                  sess.run(None, {'histogram': hist, 'metadata': meta})
              
              # Benchmark
              times = []
              for _ in range(100):
                  start = time.perf_counter()
                  sess.run(None, {'histogram': hist, 'metadata': meta})
                  times.append(time.perf_counter() - start)
              
              print(f'{model_name}: {np.mean(times)*1000:.2f} ms avg, {np.std(times)*1000:.2f} ms std')
          "

      - name: Comment benchmark results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🏎️ Inference Benchmark Results\n```\n' + output + '\n```'
            })