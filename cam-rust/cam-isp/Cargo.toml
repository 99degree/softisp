[package]
name = "cam-isp"
version = "0.1.0"
edition = "2021"

[dependencies]
cam-types = { path = "../cam-types" }
serde = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
libloading = "0.8"
libc = "0.2"
tempfile = "3.8"

[build-dependencies]
cc = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
env_logger = { workspace = true }
prost = "0.14.4"

[[example]]
name = "mnn_memfd_test"
required-features = ["mnn"]

[[example]]
name = "bench_hd"
required-features = ["mnn"]

[[example]]
name = "bench_blocks"
required-features = ["mnn"]

[[example]]
name = "bench_unpack_fused"
required-features = ["mnn"]

[features]
default = []
mnn_buffer = []
ort = ["dep:ort"]
mnn = ["mnn_buffer"]

[dependencies.ort]
version = "2.0.0-rc.12"
optional = true

