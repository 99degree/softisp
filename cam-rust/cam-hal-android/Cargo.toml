[package]
name = "cam-hal-android"
version = "0.1.0"
edition = "2021"

[dependencies]
cam-types = { path = "../cam-types" }
cam-hal = { path = "../cam-hal" }
log = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"

# V4L2 via rscam crate (optional, for camera detection on Linux-based Android)
rscam = { version = "0.5", optional = true }

[features]
default = []
v4l2 = ["rscam"]
