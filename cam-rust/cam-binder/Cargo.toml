[package]
name = "cam-binder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cam-demo"
path = "src/bin/demo.rs"

[dependencies]
cam-types = { path = "../cam-types" }
cam-core = { path = "../cam-core" }
cam-hal = { path = "../cam-hal" }
cam-isp = { path = "../cam-isp" }
cam-hal-linux = { path = "../cam-hal-linux", optional = true }
log = { workspace = true }
thiserror = { workspace = true }
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
v4l2 = ["dep:cam-hal-linux"]
android = []
