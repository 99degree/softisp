[package]
name = "cam-binder"
version = "0.1.0"
edition = "2021"

[dependencies]
cam-types = { path = "../cam-types" }
cam-isp = { path = "../cam-isp" }
cam-hal = { path = "../cam-hal" }
cam-core = { path = "../cam-core" }
log = { workspace = true }

# The binder crate provides the IPC transport
rsbinder = { version = "0.8", optional = true }

[features]
default = []
android = ["rsbinder"]
