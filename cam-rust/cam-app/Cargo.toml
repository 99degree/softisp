[package]
name = "cam-app"
version = "0.1.0"
edition = "2021"

[dependencies]
cam-types = { path = "../cam-types" }
cam-isp = { path = "../cam-isp" }
cam-core = { path = "../cam-core" }
cam-onnx = { path = "../cam-onnx" }
cam-motion = { path = "../cam-motion" }

log = { workspace = true }
env_logger = "0.10"
clap = { version = "4", features = ["derive"] }

[features]
default = []
mnn = ["cam-isp/mnn"]
v4l2 = []  # placeholder for future camera integration
binder = [] # placeholder for binder service
