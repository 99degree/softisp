[workspace]
resolver = "2"
members = [
    "cam-types",
    "cam-isp",
    "cam-hal",
    "cam-hal-android",
    "cam-hal-linux",
    "cam-core",
    "cam-onnx",
    "cam-motion",
    "cam-binder",
    "cam-disp",
    "cam-camera-app",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = "2"
env_logger = "0.10"
android_logger = "0.14"
# NativeActivity lifecycle + ANativeWindow (cam-camera-app).
android-activity = { version = "0.6.1", features = ["native-activity"] }
# Raw ACamera* / AImageReader* NDK bindings (cam-camera-app).
ndk-sys = { version = "0.6", features = ["media"] }

[profile.dev]
debug = 1
overflow-checks = false

[profile.test]
debug = 1
overflow-checks = false

# APK release profile — tuned for low-RAM devices (Termux/Android).
# debug = 1 keeps line-number tables without full DWARF, cutting peak RSS
# during codegen and linking by roughly half. overflow-checks off reduces
# generated code size. codegen-units = 1 lowers parallel memory pressure at
# the cost of slightly longer build time — acceptable on memory-constrained
# hosts where the APK is actually produced.
[profile.release]
opt-level = 2
debug = 1
overflow-checks = false
codegen-units = 1
panic = "abort"
