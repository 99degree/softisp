[package]
name = "cam-hal-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
cam-types = { path = "../cam-types" }
cam-isp = { path = "../cam-isp" }
cam-hal = { path = "../cam-hal" }
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# V4L2 via rscam crate; rscam itself is Linux/FreeBSD-only.
rscam = { version = "0.5", optional = true }

[features]
default = []
v4l2 = ["rscam"]
