[package]
name = "softisp-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cam-isp]
path = "../cam-isp"

# Prevent this from being accidentally compiled and run
[[bin]]
name = "fuzz_onnx_parse"
path = "fuzz_targets/fuzz_onnx_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pipeline_config"
path = "fuzz_targets/fuzz_pipeline_config.rs"
test = false
doc = false

[[bin]]
name = "fuzz_profile"
path = "fuzz_targets/fuzz_profile.rs"
test = false
doc = false

[[bin]]
name = "fuzz_block_id"
path = "fuzz_targets/fuzz_block_id.rs"
test = false
doc = false

[profile.release]
debug = true
