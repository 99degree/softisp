[package]
name = "cam-camera-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "cam_camera_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
cam-isp = { path = "../cam-isp" }
cam-types = { path = "../cam-types" }
log = { workspace = true }
# NativeActivity lifecycle, input queue and ANativeWindow handling.
android-activity = { version = "0.6.1", features = ["native-activity"] }
# Raw ACamera* / AImageReader* bindings. Pinned to the same version
# android-activity uses so both crates agree on the NDK ABI; `media` adds
# AImageReader, which camera2 capture needs.
ndk-sys = { version = "0.6", features = ["media"] }

# Routes log:: macros to logcat. The app has no Java layer, so without a logger
# the `log::info!`/`log::warn!` calls — including crashlog's own path failures —
# are silently discarded. Android-only: `cargo test` builds this crate for the
# host too, where the logger is a no-op (see `init_logger`).
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true }

[features]
default = []
# Vulkan MNN inference. This is what the camera app actually wants on a phone:
# libMNN_Vulkan.so runs the block chain on the GPU, where the CPU engine is
# roughly 3x slower on Conv-heavy stages. Requires the runtime libraries under
# `runtime_libs` to be bundled, which is why the feature is not default: the
# `mnn` engine in cam-isp links them directly rather than dlopen-ing them.
mnn = ["cam-isp/mnn"]

# ── APK packaging (cargo-apk2) ───────────────────────────────────────────

[package.metadata.android]
apk_name = "softisp-camera"
# Application ID, kept in sync with the `<manifest package>` in the override
# below. It is still needed here even though the manifest is hand-written:
# ndk-build2 renames the unaligned APK to `manifest.package` while running
# `aapt2 optimize`, so the field must be present and usable as a filename.
package = "com.softisp.camera"
# The manifest is supplied whole rather than generated. cargo-apk2 1.4.2 emits
# `android:allowNativeHeapPointerTagging` and `android:requestLegacyExternalStorage`
# as child elements of `<application>` instead of attributes (quick-xml needs an
# `@` prefix in the serde rename, which ndk-build2 1.4.2 omits), and every entry
# is emitted even when unset. See the header of AndroidManifest.xml; that file is
# the source of truth for the shipped manifest, and this table stays the source
# of truth for what cargo-apk2 needs in memory (activity list, target SDK).
manifest_override = "AndroidManifest.xml"
# Icon + string resources live with the rest of the app scaffolding.
resources = "../../android-app/Sources/res"
# Runtime native libraries copied into lib/<abi>/ by cargo-apk2. MNN's Vulkan
# backend is dlopen-ed by the engine, and the ICD loader is not on the Termux
# search path, so all three have to ship inside the APK. The directory uses
# cargo-apk2's `<name>/<abi>` layout, hence the arm64-v8a symlink next to the
# build.rs-generated aarch64-v8a one.
runtime_libs = "../lib"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = true

# Required for `ACameraManager_openCamera`.
[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

# The crash log lives in the public Download directory.
#
# API 29 and below: WRITE_EXTERNAL_STORAGE is a runtime permission.
# API 30 and above: scoped storage is mandatory, and the only route to the
# public Download directory is the "all files access" special access
# (MANAGE_EXTERNAL_STORAGE), which the user grants from Settings. A
# NativeActivity has no Activity object to show that dialog, so it cannot
# self-request the grant; storage::probe re-tests the path at startup and
# logs exactly which grant is missing.
#
# `requestLegacyExternalStorage` is deliberately absent: cargo-apk2 serialises it
# as a child element rather than the `android:` attribute Android reads, and
# targetSdk 34 would ignore it regardless.
[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.signing.release]
# A throwaway key for local installs. Override both of these before shipping.
path = "../../android-app/my-release-key.keystore"
keystore_password = "password"

[package.metadata.android.application]
label = "SoftISP Camera"
has_code = false
debuggable = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
icon = "@mipmap/icon"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
# Rotation, density and UI-mode changes are absorbed here so the activity is
# not recreated mid-preview: lib.rs re-takes the window and reallocates the
# presentation buffers on the resulting resize events.
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|keyboard|navigation|uiMode|density|layoutDirection"
#
# `android.app.lib_name` is what NativeActivity dlopen()s; it must match the
# `cam_camera_app` library name in Cargo.toml. It belongs to the *activity*:
# NativeActivity.onCreate reads `getActivityInfo(...).metaData`, so a
# meta-data entry on <application> is never seen and libname falls back to
# "main", crashing onCreate with "Unable to find native library main".
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "cam_camera_app"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
