name: SoftISP CI on: [push, pull_request] env: RUSTFLAGS: "-C debug-assertions" CARGO_TERM_COLOR: always jobs:   test:     name: Test Suite     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4       - name: Install Rust         run: |           rustup update stable           rustup component add rustfmt clippy       - name: Run tests         run: |           cd cam-rust           cargo test --lib --verbose -- --nocapture   fuzz:     name: Fuzzing     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4       - name: Install Rust         run: |           rustup update nightly           rustup target add aarch64-unknown-linux-gnu           cargo install cargo-fuzz       - name: Run fuzzing targets         run: |           cd cam-rust           # Run each fuzzer for 10 seconds           cargo fuzz run fuzz_onnx_parse -- -max_total_time=10 -max_len=4096           cargo fuzz run fuzz_pipeline_config -- -max_total_time=10 -max_len=4096           cargo fuzz run fuzz_profile -- -max_total_time=10 -max_len=4096           cargo fuzz run fuzz_block_id -- -max_total_time=10 -max_len=4096   sanitizers:     name: Sanitizers     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4       - name: Install Rust         run: |           rustup update nightly           rustup component add clippy rustfmt           # Required for ASAN/MSAN           sudo apt-get update           sudo apt-get install -y llvm       - name: Run AddressSanitizer         run: |           cd cam-rust           RUSTFLAGS="-Z sanitizer=address" cargo test -p cam-isp --lib           RUSTFLAGS="-Z sanitizer=address" cargo test -p cam-isp --lib --release       - name: Run ThreadSanitizer         run: |           cd cam-rust           RUSTFLAGS="-Z sanitizer=thread" cargo test -p cam-isp --lib -- --test-threads=1         env:           TSAN_OPTIONS: "suppressions=ci/tsan_suppressions.txt"   regression:     name: Regression Tests     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4       - name: Install Rust         run: |           rustup update stable       - name: Create test corpus         run: |           cd cam-rust           python3 ci/generate_corpus.py fuzz/testdata       - name: Run pipeline serializer tests         run: |           cd cam-rust           # Test pipeline serialization/deserialization with corpus           cargo test -p cam-isp serializer::tests       - name: Run GPU watchdog tests         run: |           cd cam-rust           cargo test -p cam-isp gpu_watchdog