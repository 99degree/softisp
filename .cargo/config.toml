# Cross-compilation targets for Android NDK.
#
# Usage:
#   ANDROID_NDK_HOME=~/Android/Sdk/ndk/26.1.10909125 \
#     cargo build --target aarch64-linux-android --release
#
# The linker paths below use bare names (e.g., aarch64-linux-android24-clang).
# These are found via PATH when the NDK toolchain bin/ is exported:
#   export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
#
# NOTE: Do NOT set default linker here — it interferes with native builds.
# Set linker via command line or environment:
#   cargo build --target aarch64-linux-android \
#     --config 'target.aarch64-linux-android.linker="aarch64-linux-android24-clang"'

# MNN libs live in cam-rust/lib/<abi>/ with RPATH set via patchelf.
# No system-level copies needed.
#
# Termux native build: libMNNConvertDeps.so is self-contained on the convert
# path. The AAR libMNN_Express.so requires libc++_shared.so (NDK r25c) which is
# NOT vendored in the AAR and is absent from Termux's libc++. Preloading it
# fails to resolve __emutls_get_address, so we link via LD_LIBRARY_PATH only
# (no LD_PRELOAD).
#
# This file lives at the repository root because that is the only workspace
# root: cam-rust/ has no Cargo.toml, so `cargo build` in either directory reads
# this config and writes the same target/ tree.
[target.aarch64-linux-android]
runner = "env LD_LIBRARY_PATH=/data/data/com.termux/files/home/softisp/cam-rust/lib/aarch64-v8a:/system/lib64:/vendor/lib64"
