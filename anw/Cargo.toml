[package]
name = "softisp_anw"
version = "0.1.0"
edition = "2021"
description = "ANativeWindow consumer for softisp IPA on Android"
license = "MIT OR Apache-2.0"

[dependencies]
cam-ipa = { path = "../cam-rust/cam-ipa" }
ndk-sys = { version = "0.6", features = ["nativewindow"] }
thiserror = { workspace = true }
log = { workspace = true }

[lib]
name = "softisp_anw"
path = "src/lib.rs"
crate-type = ["cdylib"]